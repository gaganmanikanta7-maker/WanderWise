services:
  - type: web
    name: wanderwise-travel-planner
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: wanderwise-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: wanderwise-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: wanderwise-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: wanderwise-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wanderwise-db
          property: password
databases:
  - name: wanderwise-db
    plan: free
    databaseName: wanderwise
    user: wanderwise
